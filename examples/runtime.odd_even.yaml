data:
  provider: goldarb_api
  source: https://goldarb.ir
  symbols: ["طلا"]
  grain: 1s

runtime:
  mode: live_paper_local
  initial_cash: "1000000000"
  allow_short: false
  database: ":memory:"

session:
  timezone: Asia/Tehran
  start: "12:00:00"
  end: "18:00:00"
  poll_seconds: 1.0
  max_polls: 20

strategy:
  name: odd_even
  params:
    quantity: "1"
    symbol: "طلا"

fee:
  name: PercentFee
  params:
    fee_rate: "0.0005"

slippage:
  name: NoSlippage

latency:
  name: NoLatency