# Offline backtest — same strategy/fee/slippage shape as runtime.live.yaml.
# Only runtime.mode + data.* differ.
#
#   .venv/bin/python examples/run.py examples/runtime.backtest.yaml
#
# Needs: uv pip install --python .venv/bin/python -e '.[yaml]'
# Data: archive/1s-14d (30 gold funds, 1s bars).

data:
  provider: archive
  source: archive/1s-14d
  dataset: fund-bars
  symbols:
    - گوهر
    - زر
    - عیار
    - کهربا
    - طلا
    - گلدیس
    - آلتون
    - درنا
    - لیان
    - ناب
    - آتش
    - قیراط
    - زرگر
    - زروان
    - مثقال
    - نفیس
    - امرالد
    - زرفام
    - درخشان
    - تابش
  grain: 1s
  start: "2026-09-15"
  end: "2026-09-15"
  fill_session: false
  session_hours: false

runtime:
  mode: offline_backtest
  initial_cash: "1000000000"
  allow_short: false
  database: ":memory:"
  label: price_momentum_backtest

session:
  timezone: Asia/Tehran
  start: "12:00:00"
  end: "18:00:00"
  poll_seconds: 1.0

strategy:
  name: price_momentum
  params:
    quantity: "1"
    threshold_pct: "0.1"

fee:
  name: PercentFee
  params:
    fee_rate: "0.0005"

slippage:
  name: NoSlippage

latency:
  name: NoLatency
