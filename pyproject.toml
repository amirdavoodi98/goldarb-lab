[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldarb-lab"
version = "0.1.0"
description = "Python client for Gold Arbitrage strategy lab (historical fund/XAU bars)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gold Arbitrage" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/amirdavoodi98/gold-arbitrage"

[tool.hatch.build.targets.wheel]
packages = ["src/goldarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
