[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldarb-lab"
version = "0.6.0"
description = "Python client for Gold Arbitrage strategy lab (fund/XAU/USDT bars + live tips)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gold Arbitrage" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/amirdavoodi98/goldarb-lab"
Repository = "https://github.com/amirdavoodi98/goldarb-lab"
Issues = "https://github.com/amirdavoodi98/goldarb-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/goldarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
